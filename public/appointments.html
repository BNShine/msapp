<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Dashboard</title>
    <link href="output.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/lucide-static@latest/dist/umd/lucide.js"></script>
</head>
<body class="min-h-screen bg-background flex flex-col">

    <header class="bg-card shadow-large border-b border-border">
      </header>

    <main class="flex-1 p-8 overflow-y-auto">
        <div class="max-w-7xl mx-auto space-y-8">

            <section id="availability-checker-section" class="rounded-lg border bg-card text-card-foreground shadow-large">
                <div class="flex flex-col space-y-1.5 p-6 border-b border-border">
                    <h2 class="text-2xl font-bold bg-gradient-primary bg-clip-text text-transparent">
                        1. Smart Availability Check
                    </h2>
                    <p class="text-sm text-muted-foreground">Enter customer details to find the best appointment slots automatically.</p>
                </div>
                <div class="p-6 space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="space-y-2">
                            <label for="customer-zip-code" class="block text-sm font-semibold text-foreground">Customer Zip Code</label>
                            <input type="text" id="customer-zip-code" placeholder="Enter 5-digit zip code" class="input-style">
                        </div>
                        <div class="space-y-2">
                            <label for="num-pets" class="block text-sm font-semibold text-foreground">Number of Pets</label>
                            <input type="number" id="num-pets" value="1" min="1" class="input-style">
                        </div>
                        <div class="space-y-2">
                            <label for="appointment-margin" class="block text-sm font-semibold text-foreground">Scheduling Margin</label>
                            <select id="appointment-margin" class="input-style">
                                <option value="10">10 minutes</option>
                                <option value="20">20 minutes</option>
                                <option value="30" selected>30 minutes</option>
                                <option value="40">40 minutes</option>
                                <option value="50">50 minutes</option>
                                <option value="60">60 minutes</option>
                            </select>
                        </div>
                    </div>
                    <div id="availability-results" class="mt-4"></div>
                    <div class="flex flex-col sm:flex-row gap-4">
                        <button id="verify-availability-btn" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-xl text-base font-bold bg-gradient-primary text-white hover:shadow-brand hover:-translate-y-0.5 transform transition-all duration-300 h-12 px-8">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search-check w-4 h-4"><path d="m8 11 4 4 8-8"/><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                            Check Availability
                        </button>
                        <button id="skip-to-manual-btn" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-xl text-sm font-semibold h-12 px-6 border-2 border-border text-muted-foreground hover:border-brand-primary hover:text-brand-primary transition-colors">
                            Manual Scheduling
                        </button>
                    </div>
                </div>
            </section>

            <section id="main-appointment-form" class="rounded-lg border bg-card text-card-foreground shadow-large hidden">
                <div class="flex flex-col space-y-1.5 p-6 border-b border-border">
                    <h2 class="text-2xl font-bold bg-gradient-primary bg-clip-text text-transparent">
                        Register New Appointment (E2E Lead Track)
                    </h2>
                    <p class="text-sm text-muted-foreground">Fill in all mandatory fields to create a new Lead in the Sales Pipeline.</p>
                </div>
                
                <form id="scheduleForm" class="p-6">
                    </form>
            </section>
        </div>
    </main>

    <style>
        .input-style {
            @apply mt-1 block w-full h-12 rounded-xl border-2 border-foreground/80 hover:border-brand-primary transition-colors bg-muted/50 px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50;
        }
        .input-display-style {
            @apply mt-1 w-full rounded-xl border-2 border-foreground/80 bg-muted/50 px-3 py-2 text-sm font-mono;
        }
        input[type="datetime-local"] { color: hsl(var(--foreground)); }
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active  {
            -webkit-box-shadow: 0 0 0px 1000px hsl(var(--muted) / 0.5) inset !important;
            -webkit-text-fill-color: hsl(var(--foreground)) !important;
            border-color: hsl(var(--foreground) / 0.8) !important;
            transition: background-color 5000s ease-in-out 0s !important;
        }
    </style>
    
    <script src="appointment/dashboard-cards.js"></script>
    <script src="appointment/availability-check.js"></script> <script src="appointment/appointment-form.js"></script>
</body>
</html>

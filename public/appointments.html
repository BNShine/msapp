<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Dashboard</title>
    <link href="output.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/lucide-static@latest/dist/umd/lucide.js"></script>
</head>
<body class="min-h-screen bg-background flex flex-col">

    <header class="bg-card shadow-large border-b border-border">
      </header>

    <main class="flex-1 p-8 overflow-y-auto">
        <div class="max-w-7xl mx-auto space-y-8">

            <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                <div class="rounded-lg border bg-card text-card-foreground shadow-sm bg-gradient-subtle p-6">
                    <h3 class="text-sm font-medium text-muted-foreground">Today's Appointments</h3>
                    <p id="todayAppointmentsCount" class="text-4xl font-bold text-foreground">0</p>
                    <p id="appointmentDifference" class="text-sm font-medium"></p>
                </div>
                <div class="rounded-lg border bg-card text-card-foreground shadow-sm bg-gradient-subtle p-6">
                    <h3 class="text-sm font-medium text-muted-foreground">Customers This Month</h3>
                    <p id="customersThisMonthCount" class="text-4xl font-bold text-foreground">0</p>
                    <p id="customersThisMonthPercentage" class="text-sm font-medium"></p>
                </div>
                <div class="rounded-lg border bg-card text-card-foreground shadow-sm bg-gradient-subtle p-6">
                    <h3 class="text-sm font-medium text-muted-foreground">Pets Scheduled</h3>
                    <p id="petsThisMonthCount" class="text-4xl font-bold text-foreground">0</p>
                    <p id="petsThisMonthPercentage" class="text-sm font-medium"></p>
                </div>
                <div class="rounded-lg border bg-card text-card-foreground shadow-sm bg-gradient-subtle p-6">
                    <h3 class="text-sm font-medium text-muted-foreground">Top Closer</h3>
                    <p id="bestSellerName" class="text-4xl font-bold text-foreground">--</p>
                </div>
            </section>

            <section id="availability-checker-section" class="rounded-lg border bg-card text-card-foreground shadow-large">
                </section>
            
            <section id="main-appointment-form" class="hidden rounded-lg border bg-card text-card-foreground shadow-large">
                </section>
        </div>
    </main>

    <style>
        /* Suas classes de estilo (sem alterações) */
    </style>
    
    <script src="/appointment/dashboard-cards.js"></script>
    <script src="/appointment/appointment-form.js"></script>
    <script src="/appointment/availability-check.js"></script>
</body>
</html>

<div class="mb-8 p-6 border border-border/50 rounded-xl bg-muted/30">
    <div class="hidden">
        <input type="date" id="data" name="data" class="input-style">
        <select id="type" name="type"><option value="Central">Central</option></select>
        <select id="week" name="week"><option value="1">1</option></select>
        <select id="month" name="month"><option value="1">1</option></select>
        <select id="year" name="year"><option value="2025">2025</option></select>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="space-y-2">
            <label for="codePassDisplay" class="block text-sm font-semibold text-foreground">Confirmation Code (Generated)</label>
            <div id="codePassDisplay" class="h-12 flex items-center input-display-style">--/--/----</div>
        </div>
        
        <div class="space-y-2">
            <label for="statusDisplay" class="block text-sm font-semibold text-foreground">Status</label>
            <div id="statusDisplay" class="h-12 flex items-center input-display-style text-green-600 font-bold">Scheduled</div>
        </div>
        
        <div class="space-y-2">
            <label for="reminderDateDisplay" class="block text-sm font-semibold text-foreground">Reminder Date (5 Months)</label>
            <div id="reminderDateDisplay" class="h-12 flex items-center input-display-style">--/--/----</div>
        </div>
        
        <div class="space-y-2 md:col-span-3 pt-4"> 
            <label for="submit" class="block text-sm font-semibold text-foreground opacity-0">Action</label>
            <button type="submit" form="scheduleForm" class="w-full inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-xl text-base font-bold bg-gradient-primary text-white hover:shadow-brand hover:-translate-y-0.5 transform transition-all duration-300 h-12 px-8">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-send w-4 h-4"><path d="m22 2-11 11m0 0-3 9 9-3L22 2zM12 12 3 21"/></svg>
                Register Appointment
            </button>
        </div>
    </div>
</div>

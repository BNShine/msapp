<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard</title>
    <link href="output.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/lucide-static@latest/dist/umd/lucide.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-background flex flex-col">

    <header class="bg-card shadow-large border-b border-border">
</header>

    <main class="flex-1 p-8 overflow-y-auto">
        <div class="max-w-7xl mx-auto">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
</div>
            <div class="rounded-lg border bg-card text-card-foreground shadow-large bg-gradient-subtle">
                <div class="flex flex-col space-y-1.5 p-6 pb-8">
                    <h2 class="text-2xl font-bold bg-gradient-primary bg-clip-text text-transparent">
                        Customer List
                    </h2>
                    <div class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="text" id="search-input" placeholder="Search by name, phone, or city" class="rounded-xl border-2 border-border hover:border-brand-primary transition-colors bg-background px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50">
                        <input type="date" id="start-date-filter" class="rounded-xl border-2 border-border hover:border-brand-primary transition-colors bg-background px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50">
                        <input type="date" id="end-date-filter" class="rounded-xl border-2 border-border hover:border-brand-primary transition-colors bg-background px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50">
                        <select id="franchise-filter" class="rounded-xl border-2 border-border hover:border-brand-primary transition-colors bg-background px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50">
                            <option value="">All Franchises</option>
                        </select>
                        <select id="closer-filter" class="rounded-xl border-2 border-border hover:border-brand-primary transition-colors bg-background px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50">
                            <option value="">All Closers</option>
                        </select>
                        <select id="month-filter" class="rounded-xl border-2 border-border hover:border-brand-primary transition-colors bg-background px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50">
                            <option value="">All Months</option>
                        </select>
                        <select id="year-filter" class="rounded-xl border-2 border-border hover:border-brand-primary transition-colors bg-background px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50">
                            <option value="">All Years</option>
                        </select>
                        <select id="reminder-filter" class="rounded-xl border-2 border-border hover:border-brand-primary transition-colors bg-background px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50">
                            <option value="">Todos</option>
                            <option value="send-reminder">Pend.</option>
                        </select>
                    </div>
                    <div class="mt-6 col-span-1 md:col-span-2">
                        <button id="display-data-btn" class="w-full inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-xl text-sm font-semibold ring-offset-background transition-all duration-300 h-11 px-6 py-3 bg-brand-primary text-white hover:shadow-brand">
                            Exibir
                        </button>
                    </div>
                </div>
                <div class="p-6 pt-0 overflow-x-auto">
                    <table class="min-w-full text-left">
                        <thead class="bg-muted text-muted-foreground uppercase text-xs font-semibold whitespace-nowrap">
                            <tr>
                                <th class="p-4 border-b border-border hidden">Date</th> 
                                <th class="p-4 border-b border-border">Customers</th>
                                <th class="p-4 border-b border-border">Pets</th>
                                <th class="p-4 border-b border-border">Closer (1)</th>
                                <th class="p-4 border-b border-border">Closer (2)</th>
                                <th class="p-4 border-b border-border">Phone</th>
                                <th class="p-4 border-b border-border">Appointment</th>
                                <th class="p-4 border-b border-border">Service Value</th>
                                <th class="p-4 border-b border-border">Franchise</th>
                                <th class="p-4 border-b border-border">Month</th>
                                <th class="p-4 border-b border-border">Code</th>
                                <th class="p-4 border-b border-border">Reminder</th>
                            </tr>
                        </thead>
                        <tbody id="customers-table-body" class="text-foreground text-xs">
                            <tr>
                                <td colspan="12" class="p-4 text-center">Loading customer data...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
    <script src="customers.js"></script>
</body>
</html>

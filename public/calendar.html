<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technician Scheduler</title>
    <link href="output.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/lucide-static@latest/dist/umd/lucide.js"></script>
    
    <style>
        .scheduler-grid {
            display: grid;
            grid-template-columns: 80px repeat(7, minmax(150px, 1fr)); 
            grid-auto-rows: minmax(60px, auto); 
            overflow-x: auto;
            min-width: 100%;
        }
        .time-slot {
            height: 60px;
            position: relative;
        }
        .appointment-block {
            /* NOTA: A largura dos blocos de agendamento e de tempo é fixada em 150px para consistência visual. */
            width: 150px;
            height: 120px; 
            position: absolute;
            left: 0;
            top: 0; 
            padding: 8px; 
            box-sizing: border-box;
            z-index: 10;
        }
        .timeline-header {
            grid-column: 1;
            position: sticky;
            left: 0;
            background-color: hsl(var(--card));
            z-index: 20;
        }
        .day-column-header {
            text-align: center;
        }
        .bg-custom-primary { background-color: hsl(337 100% 67%); }
        .bg-green-600 { background-color: rgb(22 163 74); }
        .bg-cherry-red { background-color: hsl(0 84% 45%); }
        
        .modal-overlay-fixed {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            z-index: 1000;
        }

        body.modal-open {
            overflow: hidden !important; 
        }
        
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body class="bg-background">

    <header class="bg-card shadow-large border-b border-border">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
          <div class="flex items-center gap-4">
            <h1 class="text-xl font-bold text-foreground">Technician Scheduler</h1>
          </div>
          <a href="appointments.html" class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-xl text-sm font-semibold h-11 px-6 py-3 bg-brand-primary text-white hover:shadow-brand">
             <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus w-4 h-4"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
             New Appointment
          </a>
        </div>
      </div>
    </header>

    <main class="p-8">
        <div class="max-w-[98rem] mx-auto space-y-8">
            <section class="rounded-lg border bg-card text-card-foreground shadow-large">
                <div class="p-6 border-b border-border flex justify-between items-center flex-wrap gap-4">
                    <h2 class="text-2xl font-bold bg-gradient-primary bg-clip-text text-transparent">Weekly Schedule</h2>
                    <div class="flex items-center gap-4">
                        <button id="prev-week" class="p-2 border rounded-md hover:bg-muted">Prev</button>
                        <span id="current-week-display" class="font-bold text-lg flex items-center">Loading...</span>
                        <button id="next-week" class="p-2 border rounded-md hover:bg-muted">Next</button>
                    </div>
                </div>
                <div class="flex">
                    <div id="tech-filter-panel" class="w-64 border-r border-border p-4 space-y-4 flex-shrink-0">
                        <h3 class="text-lg font-semibold">Select Technician</h3>
                        <select id="tech-select-dropdown" class="w-full rounded-xl border-2 border-border hover:border-brand-primary transition-colors bg-background px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2">
                             <option value="">Loading Technicians...</option>
                        </select>
                        <p id="selected-tech-display" class="text-sm font-bold text-brand-primary">No Technician Selected</p>
                        <button id="add-time-block-btn" class="mt-4 w-full inline-flex items-center justify-center gap-2 rounded-xl text-sm font-semibold h-9 px-4 py-2 border-2 border-brand-primary text-brand-primary bg-transparent hover:bg-brand-primary hover:text-white transition-colors">
                            + Add Time Block
                        </button>
                    </div>
                    <div class="flex-1 overflow-x-auto">
                        <div id="scheduler-header" class="scheduler-grid border-b border-border">
                            <div class="timeline-header p-2 font-semibold">Time</div>
                        </div>
                        <div id="scheduler-body-wrapper" class="relative">
                            <div id="scheduler-body" class="scheduler-grid relative min-w-full"></div>
                            <div id="loading-overlay" class="absolute inset-0 bg-white/70 flex items-center justify-center hidden z-30">
                                <p class="text-xl font-semibold text-muted-foreground">Please select a technician.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>
    
    <script src="calendar.js"></script>

    <div id="edit-appointment-modal" class="modal-overlay-fixed hidden">
        <div class="bg-card p-6 rounded-lg shadow-2xl w-full max-w-md relative">
            <button type="button" class="absolute top-4 right-4 text-gray-500 hover:text-gray-800" id="modal-close-x-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
            <h3 class="text-xl font-bold text-foreground mb-4">Edit Appointment Details</h3>
            <form id="appointment-edit-form" class="space-y-4">
                <input type="hidden" id="modal-appt-id"><input type="hidden" id="modal-original-technician"><input type="hidden" id="modal-pet-showed"><input type="hidden" id="modal-percentage"><input type="hidden" id="modal-payment-method">
                <div class="space-y-2">
                    <label for="modal-date" class="block text-sm font-semibold text-foreground">Date and Time</label>
                    <input type="datetime-local" id="modal-date" required class="w-full rounded-xl border-2 border-border bg-background px-3 py-2 text-sm">
                </div>
                <div class="space-y-2">
                    <label for="modal-verification" class="block text-sm font-semibold text-foreground">Status</label>
                    <select id="modal-verification" class="w-full rounded-xl border-2 border-border bg-background px-3 py-2 text-sm"></select>
                </div>
                <div class="space-y-2">
                    <label for="modal-service-value" class="block text-sm font-semibold text-foreground">Service Value</label>
                    <input type="text" id="modal-service-value" placeholder="Ex: 150.00" class="w-full rounded-xl border-2 border-border bg-background px-3 py-2 text-sm">
                </div>
                <div class="space-y-2">
                    <label for="modal-tips" class="block text-sm font-semibold text-foreground">Tips</label>
                    <input type="text" id="modal-tips" placeholder="Ex: 20.00" class="w-full rounded-xl border-2 border-border bg-background px-3 py-2 text-sm">
                </div>
            </form>
            <div class="mt-6 flex justify-end gap-3">
                <button id="modal-save-btn" type="button" class="inline-flex items-center rounded-xl text-sm font-semibold h-11 px-6 py-3 bg-brand-primary text-white hover:shadow-brand">Save Changes</button>
                <button id="modal-cancel-btn" type="button" class="inline-flex items-center rounded-xl text-sm font-semibold h-11 px-6 py-3 border border-border text-foreground hover:bg-muted">Cancel</button>
            </div>
        </div>
    </div>

    <div id="time-block-modal" class="modal-overlay-fixed hidden">
        <div class="bg-card p-6 rounded-lg shadow-2xl w-full max-w-md relative">
            <h3 class="text-xl font-bold text-foreground mb-4">Add New Time Block</h3>
            <form id="time-block-form" class="space-y-4">
                <div class="space-y-2">
                    <label for="block-date" class="block text-sm font-semibold text-foreground">Date</label>
                    <input type="date" id="block-date" required class="w-full rounded-xl border-2 border-border bg-background px-3 py-2 text-sm">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2"><label for="block-start-hour" class="block text-sm font-semibold text-foreground">Start Time</label><input type="time" id="block-start-hour" required class="w-full rounded-xl border-2 border-border bg-background px-3 py-2 text-sm"></div>
                    <div class="space-y-2"><label for="block-end-hour" class="block text-sm font-semibold text-foreground">End Time</label><input type="time" id="block-end-hour" required class="w-full rounded-xl border-2 border-border bg-background px-3 py-2 text-sm"></div>
                </div>
                <div class="space-y-2">
                    <label for="block-notes" class="block text-sm font-semibold text-foreground">Notes (Reason)</label>
                    <textarea id="block-notes" rows="3" class="w-full rounded-xl border-2 border-border bg-background px-3 py-2 text-sm" placeholder="Ex: Lunch..."></textarea>
                </div>
            </form>
            <div class="mt-6 flex justify-end gap-3">
                <button id="block-save-btn" type="button" class="inline-flex items-center rounded-xl text-sm font-semibold h-11 px-6 py-3 bg-brand-primary text-white hover:shadow-brand">Save Block</button>
                <button id="block-cancel-btn" type="button" class="inline-flex items-center rounded-xl text-sm font-semibold h-11 px-6 py-3 border border-border text-foreground hover:bg-muted">Cancel</button>
            </div>
        </div>
    </div>
    
    <div id="edit-time-block-modal" class="modal-overlay-fixed hidden">
        <div class="bg-card p-6 rounded-lg shadow-2xl w-full max-w-md relative">
            <h3 class="text-xl font-bold text-foreground mb-4">Edit Time Block Details</h3>
            <form id="edit-time-block-form" class="space-y-4">
                <input type="hidden" id="edit-block-row-number">
                <div class="space-y-2"><label for="edit-block-date" class="block text-sm font-semibold text-foreground">Date</label><input type="date" id="edit-block-date" required class="w-full rounded-xl border-2 border-border bg-background px-3 py-2 text-sm"></div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2"><label for="edit-block-start-hour" class="block text-sm font-semibold text-foreground">Start Time</label><input type="time" id="edit-block-start-hour" required class="w-full rounded-xl border-2 border-border bg-background px-3 py-2 text-sm"></div>
                    <div class="space-y-2"><label for="edit-block-end-hour" class="block text-sm font-semibold text-foreground">End Time</label><input type="time" id="edit-block-end-hour" required class="w-full rounded-xl border-2 border-border bg-background px-3 py-2 text-sm"></div>
                </div>
                <div class="space-y-2">
                    <label for="edit-block-notes" class="block text-sm font-semibold text-foreground">Notes (Reason)</label>
                    <textarea id="edit-block-notes" rows="3" class="w-full rounded-xl border-2 border-border bg-background px-3 py-2 text-sm" placeholder="Ex: Lunch..."></textarea>
                </div>
            </form>
            <div class="mt-6 flex justify-between gap-3">
                <button id="edit-block-delete-btn" type="button" class="inline-flex items-center rounded-xl text-sm font-semibold h-11 px-6 py-3 bg-red-600 text-white hover:bg-red-700">Delete</button>
                <div class="flex gap-3">
                    <button id="edit-block-save-btn" type="button" class="inline-flex items-center rounded-xl text-sm font-semibold h-11 px-6 py-3 bg-brand-primary text-white hover:shadow-brand">Save Changes</button>
                    <button id="edit-block-cancel-btn" type="button" class="inline-flex items-center rounded-xl text-sm font-semibold h-11 px-6 py-3 border border-border text-foreground hover:bg-muted">Cancel</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technician Scheduler</title>
    <link href="../output.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/lucide-static@latest/dist/umd/lucide.js"></script>
    
    <style>
        /* --- ESTILOS GERAIS PARA O NOVO LAYOUT --- */
        body {
            background-color: #f7f8fa; /* Um fundo ligeiramente mais suave */
        }

        .calendar-container {
            border: 1px solid hsl(var(--border));
            border-radius: var(--radius);
            background-color: hsl(var(--card));
            box-shadow: var(--shadow-soft);
            overflow: hidden; /* Garante que os cantos arredondados sejam aplicados a tudo */
        }
        
        /* --- ESTILOS DOS CARDS DE AGENDAMENTO --- */
        .appointment-card {
            position: absolute;
            left: 2px;
            right: 2px;
            background-color: #f8f9fc; /* Cor de fundo neutra e clara */
            border-left: 4px solid; /* Borda colorida para status */
            padding: 4px 8px;
            border-radius: 4px;
            overflow: hidden;
            transition: all 0.2s ease;
            color: #333; /* Texto mais escuro para melhor legibilidade */
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .appointment-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-medium);
            z-index: 15;
        }

        .appointment-card p {
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-title { font-weight: 600; font-size: 0.8rem; }
        .card-time, .card-details { font-size: 0.75rem; color: #555; }

        /* Cores da borda para cada status (usando a sua paleta) */
        .status-scheduled { border-color: hsl(var(--brand-primary)); }
        .status-confirmed { border-color: #f9d872; }
        .status-showed   { border-color: rgb(22 163 74); }
        .status-canceled  { border-color: hsl(0 84% 45%); }

        /* --- ESTILOS DO CALENDÁRIO GRID --- */
        .scheduler-grid {
            display: grid;
            grid-template-columns: 60px repeat(7, 1fr); /* Coluna de tempo mais estreita */
            grid-auto-rows: 30px; /* Slots de 30 minutos (60px por hora) */
        }
        .time-label {
            grid-column: 1;
            text-align: right;
            padding-right: 10px;
            font-size: 0.75rem;
            color: hsl(var(--muted-foreground));
            position: relative;
            top: -8px; /* Alinha o texto com a linha */
        }
        .day-column {
            position: relative;
            border-right: 1px solid hsl(var(--border));
        }
        .day-column:last-child {
            border-right: none;
        }
        .hour-line {
            border-top: 1px solid hsl(var(--border));
            grid-column: 2 / span 7;
        }
        .day-header {
            text-align: center;
            padding: 12px 0;
            font-weight: 500;
            border-bottom: 1px solid hsl(var(--border));
        }
        .day-header.today {
            background-color: hsl(var(--brand-primary) / 0.1);
            color: hsl(var(--brand-primary));
            border-radius: 50px;
            padding: 2px 6px;
        }
    </style>
</head>
<body class="bg-background text-foreground">

    <header class="bg-card border-b border-border sticky top-0 z-20">
        <div class="max-w-screen-2xl mx-auto px-4 sm:px-6 lg:px-8 py-3">
            <div class="flex items-center justify-between">
                
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-2">
                        <button id="prev-week-btn" class="p-2 rounded-md hover:bg-muted transition-colors">
                            <svg class="w-5 h-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd"></path></svg>
                        </button>
                        <button id="next-week-btn" class="p-2 rounded-md hover:bg-muted transition-colors">
                            <svg class="w-5 h-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"></path></svg>
                        </button>
                    </div>
                    <button id="today-btn" class="h-10 px-4 rounded-lg border border-border text-sm font-semibold hover:bg-muted transition-colors">Today</button>
                    <h2 id="current-week-display" class="text-xl font-semibold text-gray-700">Loading...</h2>
                </div>

                <div class="flex items-center gap-4">
                    <div id="tech-filter-panel" class="flex items-center gap-2">
                        <label for="tech-select-dropdown" class="text-sm font-medium">Technician:</label>
                        <select id="tech-select-dropdown" class="rounded-lg border-border text-sm focus:ring-brand-primary focus:border-brand-primary">
                             <option value="">Loading...</option>
                        </select>
                    </div>
                    
                    <div class="bg-muted p-1 rounded-lg flex items-center text-sm">
                        <button class="px-3 py-1 rounded-md bg-white shadow-sm">Week</button>
                        <button class="px-3 py-1 rounded-md text-muted-foreground">Month</button>
                        <button class="px-3 py-1 rounded-md text-muted-foreground">Day</button>
                    </div>

                    <a href="../appointments.html" class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-xl text-sm font-semibold h-10 px-4 py-2 bg-brand-primary text-white hover:shadow-brand transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                        New
                    </a>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-screen-2xl mx-auto p-4 sm:p-6 lg:p-8">
        
        <div class="calendar-container">
            <div id="scheduler-header" class="grid grid-cols-[60px_repeat(7,1fr)]">
                <div class="grid-col-1"></div>
            </div>
            <div id="scheduler-body" class="scheduler-grid relative">
                </div>
        </div>

        <div class="mt-12 grid grid-cols-1 lg:grid-cols-2 gap-12">
            
            <div>
                <h2 class="text-xl font-bold text-gray-800 mb-4">Manage Appointments (Current Week)</h2>
                <div class="bg-card border border-border rounded-lg shadow-sm overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-muted text-muted-foreground uppercase text-xs font-semibold">
                            <tr>
                                <th class="p-3">Date</th>
                                <th class="p-3">Customer</th>
                                <th class="p-3">Status</th>
                                <th class="p-3">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="showed-appointments-table-body" class="text-foreground text-sm">
                            <tr><td colspan="4" class="p-4 text-center text-muted-foreground">Select a technician.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
            
            <div>
                 <h2 class="text-xl font-bold text-gray-800 mb-4">Daily Itinerary & Optimization</h2>
                <div class="bg-card border border-border rounded-lg shadow-sm p-6">
                    <div class="space-y-2">
                        <label for="day-filter" class="block text-sm font-semibold text-foreground">Select Day (of the current week)</label>
                        <select id="day-filter" class="w-full rounded-xl border-2 border-border hover:border-brand-primary transition-colors bg-background px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2">
                            <option value="">Select a Day...</option>
                            <option value="1">Monday</option>
                            <option value="2">Tuesday</option>
                            <option value="3">Wednesday</option>
                            <option value="4">Thursday</option>
                            <option value="5">Friday</option>
                            <option value="6">Saturday</option>
                            <option value="0">Sunday</option>
                        </select>
                    </div>
                    <div id="itinerary-results-list" class="mt-4 space-y-2 text-sm text-muted-foreground">
                        Select a day to see the itinerary.
                    </div>
                </div>
            </div>

        </div>

    </main>
    
    <div id="edit-appointment-modal" class="modal-overlay-fixed hidden">
        </div>
    <div id="time-block-modal" class="modal-overlay-fixed hidden">
        </div>
    <div id="edit-time-block-modal" class="modal-overlay-fixed hidden">
        </div>

    <script src="calendar/schedule.js"></script>
    <script src="calendar/manageShowed.js"></script>
    <script src="calendar/itinerary.js"></script>

</body>
</html>

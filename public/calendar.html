<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technician Scheduler</title>
    <link href="output.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/lucide-static@latest/dist/umd/lucide.js"></script>
    <style>
        .scheduler-grid {
            display: grid;
            /* 80px para Time + 6 Colunas (Mon-Sat) */
            grid-template-columns: 80px repeat(6, minmax(150px, 1fr)); 
            grid-auto-rows: minmax(60px, auto); 
            overflow-x: auto;
            min-width: 100%;
        }
        .time-slot {
            height: 60px;
            position: relative; /* Container para o appointment-block (absolute) */
        }
        .appointment-block {
            /* 2 horas de duração (2 * 60px de altura) */
            height: 120px; 
            position: absolute;
            width: 100%; /* GARANTE A LARGURA RESTRITA À COLUNA */
            left: 0;
            top: 0; 
            padding: 8px; 
            box-sizing: border-box;
            z-index: 10;
        }
        .timeline-header {
            grid-column: 1;
            position: sticky;
            left: 0;
            background-color: hsl(var(--card));
            z-index: 20;
        }
        .day-column-header {
            text-align: center;
        }
        /* Definição de cores para classes utilitárias no JS */
        .bg-custom-primary { background-color: hsl(337 100% 67%); }
        .bg-green-600 { background-color: rgb(22 163 74); }
    </style>
</head>
<body class="min-h-screen bg-background flex flex-col">

    <header class="bg-card shadow-large border-b border-border">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
          <div class="flex items-center gap-4">
            <h1 class="text-xl font-bold text-foreground">Technician Scheduler</h1>
          </div>
          <a href="appointments.html" class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-xl text-sm font-semibold h-11 px-6 py-3 bg-brand-primary text-white hover:shadow-brand">
             <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus w-4 h-4"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
             New Appointment
          </a>
        </div>
      </div>
    </header>

    <main class="flex-1 p-8 overflow-y-auto">
        <div class="max-w-[86rem] mx-auto space-y-8">

            <section class="rounded-lg border bg-card text-card-foreground shadow-large">
                <div class="p-6 border-b border-border flex justify-between items-center flex-wrap gap-4">
                    <h2 class="text-2xl font-bold bg-gradient-primary bg-clip-text text-transparent">Weekly Schedule</h2>
                    <div class="flex items-center gap-4">
                        <button id="prev-week" class="p-2 border rounded-md hover:bg-muted">Prev</button>
                        <span id="current-week-display" class="font-bold text-lg flex items-center">Loading...</span>
                        <button id="next-week" class="p-2 border rounded-md hover:bg-muted">Next</button>
                    </div>
                </div>
                
                <div class="flex">
                    <div id="tech-filter-panel" class="w-64 border-r border-border p-4 space-y-4 flex-shrink-0">
                        <h3 class="text-lg font-semibold">Select Technician</h3>
                        <select id="tech-select-dropdown" class="w-full rounded-xl border-2 border-border hover:border-brand-primary transition-colors bg-background px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2">
                             <option value="">Loading Technicians...</option>
                        </select>
                        <p id="selected-tech-display" class="text-sm font-bold text-brand-primary">No Technician Selected</p>
                    </div>
                    
                    <div class="flex-1 overflow-x-auto">
                        <div id="scheduler-header" class="scheduler-grid border-b border-border" style="--num-techs: 6;">
                            <div class="timeline-header p-2 font-semibold">Time</div>
                        </div>
                        <div id="scheduler-body-wrapper" class="relative">
                            <div id="scheduler-body" class="scheduler-grid relative min-w-full" style="--num-techs: 6;">
                                </div>
                            <div id="loading-overlay" class="absolute inset-0 bg-white/70 flex items-center justify-center hidden z-30">
                                <p class="text-xl font-semibold text-muted-foreground">Please select a technician.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="rounded-lg border bg-card text-card-foreground shadow-large p-6">
                <h2 class="text-2xl font-bold bg-gradient-primary bg-clip-text text-transparent mb-6">Technician Availability Configuration</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="space-y-2 col-span-2">
                        <label for="tech-config-select" class="block text-sm font-semibold text-foreground">Select Technician to Configure</label>
                        <select id="tech-config-select" class="w-full rounded-xl border-2 border-border hover:border-brand-primary transition-colors bg-background px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2">
                            <option value="">Select Technician</option>
                        </select>
                    </div>
                    <div class="space-y-2">
                        <label for="save-availability-btn" class="block text-sm font-semibold text-foreground opacity-0">Action</label>
                        <button id="save-availability-btn" class="w-full inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-xl text-sm font-semibold ring-offset-background transition-all duration-300 h-11 px-6 py-3 bg-brand-primary text-white hover:shadow-brand">
                            Save Availability
                        </button>
                    </div>
                </div>
                
                <div id="availability-form-container" class="mt-6 space-y-4">
                    <p class="text-muted-foreground p-4 border rounded-lg bg-muted/10">Select a technician above to manage their weekly working hours (8:00 to 18:00 range).</p>
                </div>
            </section>
        </div>
    </main>
    
    <script src="calendar.js"></script>
</body>
</html>

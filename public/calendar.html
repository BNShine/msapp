<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technician Scheduler</title>
    <link href="output.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/lucide-static@latest/dist/umd/lucide.js"></script>
    
    <style>
        /* ... (Estilos omitidos por brevidade) ... */
    </style>
</head>
<body class="bg-background">

    <header class="bg-card shadow-large border-b border-border">
      </header>

    <main class="p-8">
        <div class="max-w-[98rem] mx-auto space-y-8">
            <section class="rounded-lg border bg-card text-card-foreground shadow-large">
                </section>

            <section id="day-itinerary-section" class="rounded-lg border bg-card text-card-foreground shadow-large p-6">
                <h2 class="text-2xl font-bold bg-gradient-primary bg-clip-text text-transparent mb-4">4. Daily Itinerary and Optimization</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-4">
                    <div class="space-y-2">
                        <label for="day-filter" class="block text-sm font-semibold text-foreground">Select Day (of the current week)</label>
                        <select id="day-filter" class="w-full rounded-xl border-2 border-border hover:border-brand-primary transition-colors bg-background px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2">
                            <option value="">Select a Day...</option>
                            <option value="1">Monday</option>
                            <option value="2">Tuesday</option>
                            <option value="3">Wednesday</option>
                            <option value="4">Thursday</option>
                            <option value="5">Friday</option>
                            <option value="6">Saturday</option>
                            <option value="0">Sunday</option>
                        </select>
                    </div>
                </div>
                
                <div class="flex gap-4 mt-4 mb-4">
                    <button id="optimize-itinerary-btn" class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-xl text-sm font-semibold ring-offset-background transition-all duration-300 h-11 px-6 py-3 bg-brand-primary text-white hover:shadow-brand disabled:opacity-50" disabled>
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-route w-4 h-4"><path d="M3 3v18h18"/><path d="m21 7-5 5h5"/><path d="m11 11-3 3h3"/><path d="m11 7-5 5h5"/></svg>
                        Itinerary Optimizer (Nearest)
                    </button>
                    <button id="itinerary-reverser-btn" class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-xl text-sm font-semibold ring-offset-background transition-all duration-300 h-11 px-6 py-3 border-2 border-brand-primary text-brand-primary bg-transparent hover:bg-brand-primary hover:text-white hover:shadow-brand disabled:opacity-50" disabled>
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevrons-down-up w-4 h-4"><path d="m7 20 5-5 5 5"/><path d="m7 4 5 5 5-5"/></svg>
                        Itinerary Reverser (Farthest)
                    </button>
                </div>
                
                <h3 class="text-xl font-bold text-foreground mt-8 mb-4">Appointments for the Day</h3>
                <div class="p-6 pt-0 overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-muted text-muted-foreground uppercase text-xs font-semibold whitespace-nowrap">
                            <tr>
                                <th class="p-4 border-b border-border">Time</th>
                                <th class="p-4 border-b border-border">Customers</th>
                                <th class="p-4 border-b border-border">Phone</th>
                                <th class="p-4 border-b border-border">Zip Code</th>
                                <th class="p-4 border-b border-border">Code</th>
                                <th class="p-4 border-b border-border">Verification</th>
                                <th class="p-4 border-b border-border">Technician</th>
                            </tr>
                        </thead>
                        <tbody id="day-itinerary-table-body" class="text-foreground text-sm">
                            <tr>
                                <td colspan="7" class="p-4 text-center text-muted-foreground">Select a day and a technician to view appointments.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <h3 class="text-xl font-bold text-foreground mt-8 mb-4">Optimized Route Results</h3>
                
                <div id="scheduling-controls" class="p-4 border border-border rounded-lg bg-muted/30 mb-6 hidden">
                    <h4 class="text-lg font-semibold mb-3">Apply Optimized Route to Calendar</h4>
                    <div class="flex flex-wrap items-end gap-4">
                        <div class="space-y-2 flex-1 min-w-[200px]">
                            <label for="first-schedule-select" class="block text-sm font-semibold text-foreground">First Schedule Slot (07:00 - 21:00)</label>
                            <select id="first-schedule-select" class="w-full rounded-xl border-2 border-border bg-background px-3 py-2 text-sm">
                                </select>
                        </div>
                        <button id="apply-route-btn" class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-xl text-sm font-semibold h-11 px-6 py-3 bg-green-600 text-white hover:shadow-medium disabled:opacity-50">
                            Apply Route
                        </button>
                    </div>
                </div>
                <div id="itinerary-results-list" class="mt-4 space-y-2 text-sm text-muted-foreground">
                    No route calculated.
                </div>
            </section>
            <section class="rounded-lg border bg-card text-card-foreground shadow-large p-6">
                </section>
        </div>
    </main>
    
    <script src="calendar.js"></script>

    </body>
</html>

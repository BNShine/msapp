<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technician Scheduler</title>
    <link href="output.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/lucide-static@latest/dist/umd/lucide.js"></script>
    
    <style>
        .scheduler-grid {
            display: grid;
            grid-template-columns: 80px repeat(6, minmax(150px, 1fr)); 
            grid-auto-rows: 60px; 
            overflow-x: auto;
            min-width: 100%;
        }
        .time-slot {
            height: 60px;
            position: relative;
        }
        .appointment-block {
            height: 120px; 
            position: absolute;
            width: calc(100% - 4px);
            left: 2px;
            padding: 8px; 
            box-sizing: border-box;
            z-index: 10;
        }
        .timeline-header {
            grid-column: 1;
            position: sticky;
            left: 0;
            background-color: hsl(var(--card));
            z-index: 20;
        }
        .day-column-header { text-align: center; }
        .bg-custom-primary { background-color: hsl(337 100% 67%); }
        .bg-green-600 { background-color: rgb(22 163 74); }
        .bg-cherry-red { background-color: hsl(0 84% 45%); }
        .time-slot.night-shift { background-color: #f0f0f0; }

        .modal-overlay-fixed {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            z-index: 1000;
        }
        body.modal-open { overflow: hidden !important; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-background">

    <header class="bg-card shadow-large border-b border-border">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
          <div class="flex items-center gap-4">
            <h1 class="text-xl font-bold text-foreground">Technician Scheduler</h1>
          </div>
          <a href="appointments.html" class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-xl text-sm font-semibold h-11 px-6 py-3 bg-brand-primary text-white hover:shadow-brand">
             <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus w-4 h-4"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
             New Appointment
          </a>
        </div>
      </div>
    </header>

    <main class="p-8">
        <div class="mx-auto space-y-8 max-w-[90rem] min-w-[800px]"> 
            <section class="rounded-lg border bg-card text-card-foreground shadow-large">
                <div class="p-6 border-b border-border flex justify-between items-center flex-wrap gap-4">
                    <h2 class="text-2xl font-bold bg-gradient-primary bg-clip-text text-transparent">Weekly Schedule</h2>
                    <div class="flex items-center gap-4">
                        <button id="prev-week" class="p-2 border rounded-md hover:bg-muted">Prev</button>
                        <span id="current-week-display" class="font-bold text-lg flex items-center">Loading...</span>
                        <button id="next-week" class="p-2 border rounded-md hover:bg-muted">Next</button>
                    </div>
                </div>
                
                <div class="flex">
                    <div class="w-64 border-r border-border p-4 space-y-4 flex-shrink-0">
                        <h3 class="text-lg font-semibold">Select Technician</h3>
                        <select id="tech-select-dropdown" class="w-full rounded-xl border-2 border-border hover:border-brand-primary bg-background px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ring">
                             <option value="">Loading...</option>
                        </select>
                        <div class="space-y-2 mt-4">
                             <label for="searchCode" class="block text-sm font-semibold text-foreground">Code Filter</label>
                            <input type="text" id="searchCode" placeholder="Ex: GHY78" class="w-full rounded-xl border-2 border-border bg-background px-3 py-2 text-sm placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring">
                        </div>
                    </div>
                    
                    <div class="flex-1 overflow-x-auto">
                        <div id="scheduler-header" class="scheduler-grid border-b border-border"></div>
                        <div class="relative">
                            <div id="scheduler-body" class="scheduler-grid relative min-w-full"></div>
                            <div id="loading-overlay" class="absolute inset-0 bg-white/80 flex items-center justify-center z-30">
                                <p class="text-xl font-semibold text-muted-foreground">Select a technician to view schedule.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>
    
    <div id="edit-appointment-modal" class="modal-overlay-fixed hidden">
        <div class="bg-card p-6 rounded-lg shadow-2xl relative" style="width: 90vw; max-width: 450px;">
            <button type="button" class="absolute top-4 right-4 text-gray-500 hover:text-gray-800" id="modal-close-x-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
            <h3 class="text-xl font-bold text-foreground mb-4">Edit Appointment Details</h3>
            <form id="appointment-edit-form" class="space-y-4">
                <input type="hidden" id="modal-appt-id">
                <input type="hidden" id="modal-original-technician">
                <input type="hidden" id="modal-pet-showed">
                <input type="hidden" id="modal-tips">
                <input type="hidden" id="modal-percentage">
                <input type="hidden" id="modal-payment-method">
                <div>
                    <label for="modal-date" class="block text-sm font-semibold">Date and Time</label>
                    <input type="datetime-local" id="modal-date" required class="mt-1 w-full rounded-xl border-2 border-border bg-background px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ring">
                </div>
                <div>
                    <label for="modal-verification" class="block text-sm font-semibold">Status</label>
                    <select id="modal-verification" class="mt-1 w-full rounded-xl border-2 border-border bg-background px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ring"></select>
                </div>
                <div>
                    <label for="modal-service-value" class="block text-sm font-semibold">Service Value</label>
                    <input type="text" id="modal-service-value" placeholder="Ex: 150.00" class="mt-1 w-full rounded-xl border-2 border-border bg-background px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ring">
                </div>
            </form>
            <div class="mt-6 flex justify-end gap-3">
                <button id="modal-save-btn" type="button" class="inline-flex items-center rounded-xl text-sm font-semibold h-11 px-6 py-3 bg-brand-primary text-white hover:shadow-brand">Save</button>
                <button id="modal-cancel-btn" type="button" class="inline-flex items-center rounded-xl text-sm font-semibold h-11 px-6 py-3 border border-border hover:bg-muted">Cancel</button>
            </div>
        </div>
    </div>

    <script src="calendar.js"></script>
</body>
</html>
